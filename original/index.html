<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
<script>
  (function(){
    var mode = 'dark';
    try { mode = localStorage.getItem('ebl-theme') || 'dark'; } catch(e){}
    document.documentElement.className = mode;
  })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>E-BUSINESS LAB | Solutions</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#2b3f54;
    --orange:#fb5521;
    --grad: linear-gradient(120deg, var(--navy) 0%, var(--orange) 100%);
    --display:"Michroma","Franklin Gothic Medium",Arial,sans-serif;
    --body:"Plus Jakarta Sans","Segoe UI",-apple-system,Helvetica,Arial,sans-serif;
  }
  html.dark{
    --bg:#060606; --bg-soft:#131a21; --text:#f5f5f5; --muted:rgba(245,245,245,.62);
    --border:rgba(255,255,255,.1); --card:rgba(255,255,255,.045); --card-press:rgba(255,255,255,.09);
    --side:rgba(19,26,33,.72); --glow-a:rgba(43,63,84,.34); --glow-b:rgba(251,85,33,.16);
    --ghost:#9fb4c9;
  }
  html.light{
    --bg:#f7f5f2; --bg-soft:#ffffff; --text:#1c1f22; --muted:rgba(28,31,34,.66);
    --border:rgba(43,63,84,.16); --card:#ffffff; --card-press:#eef1f4;
    --side:rgba(255,255,255,.8); --glow-a:rgba(43,63,84,.1); --glow-b:rgba(251,85,33,.1);
    --ghost:#2b3f54;
  }

  *,*:before,*:after{ box-sizing:border-box; }
  html{
    -webkit-text-size-adjust:100%;
    font-size:clamp(13px, calc(.45vw + .55vh + 4px), 28px);
  }
  body{
    margin:0; height:100vh; height:100dvh; overflow:hidden;
    background:
      radial-gradient(circle at 12% -10%, var(--glow-a), transparent 42%),
      radial-gradient(circle at 90% 110%, var(--glow-b), transparent 46%),
      var(--bg);
    color:var(--text);
    font-family:var(--body); font-weight:400; line-height:1.5;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none;
    touch-action:manipulation; overscroll-behavior:none;
  }
  input,select,button{ font-family:inherit; }
  input,select{ -webkit-user-select:text; user-select:text; }
  button{ cursor:pointer; }
  :focus-visible{ outline:3px solid var(--orange); outline-offset:3px; }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

  #particles{ position:fixed; inset:0; z-index:0; pointer-events:none; }

  /* ---------- Shell ---------- */
  .app{ position:relative; z-index:1; height:100%; display:flex; flex-direction:column; }
  .app[data-view="home"] .top, .app[data-view="home"] .main{ display:none; }
  .app:not([data-view="home"]) .home{ display:none; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
    min-height:3.4rem; padding:0 1.5rem; border-radius:1rem; border:1px solid transparent;
    font-size:1.05rem; font-weight:700; text-decoration:none; text-align:center;
    transition:transform .15s ease, background .2s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn-fill{ background:var(--orange); color:#fff; }
  .btn-ghost{ background:transparent; color:var(--ghost); border-color:var(--ghost); }

  .wordmark{ font-family:var(--display); letter-spacing:.02em; margin:0; white-space:nowrap; }
  .wordmark span{ color:var(--orange); }
  .logo svg{ width:100%; height:auto; display:block; }

  .seg{ display:flex; border:1px solid var(--border); border-radius:.9rem; overflow:hidden; }
  .seg button{ min-width:3.4rem; min-height:3rem; border:0; background:transparent; color:var(--muted); font-size:.95rem; font-weight:700; }
  .seg button[aria-pressed="true"]{ background:var(--orange); color:#fff; }
  .icon-btn{
    width:3rem; height:3rem; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--border); border-radius:.9rem; background:transparent; color:var(--text);
  }
  .icon-btn svg{ width:1.3rem; height:1.3rem; }
  html.dark .icon-moon{ display:none; } html.light .icon-sun{ display:none; }
  .tools{ display:flex; gap:.6rem; align-items:center; }

  /* ---------- Home (touch menu) ---------- */
  .home{
    flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,.9fr) minmax(0,1.2fr);
    align-items:center; gap:3rem; padding:2rem 4.5vw;
  }
  .home-brand{ text-align:center; }
  .home-brand .logo{ width:min(100%, 24rem, 46vh); margin:0 auto 1rem; }
  .home-brand .wordmark{ font-size:clamp(1.3rem, 2.1rem, 2.4rem); }
  .tagline{ margin:1rem auto 0; max-width:24rem; font-size:1.15rem; color:var(--muted); line-height:1.4; }

  .home-menu{ display:flex; flex-direction:column; gap:1.4rem; }
  .tiles{ display:grid; grid-template-columns:1fr 1fr; gap:1.2rem; }
  .tile{
    position:relative; min-height:10.5rem; padding:1.4rem 1.5rem; text-align:left; color:var(--text);
    display:flex; flex-direction:column; justify-content:flex-end; gap:.35rem; overflow:hidden;
    background:var(--card); border:1px solid var(--border); border-radius:1.3rem;
    transition:transform .15s ease, background .2s ease;
  }
  .tile:active{ transform:scale(.97); background:var(--card-press); }
  .tile:before{ content:""; position:absolute; left:0; top:0; bottom:0; width:.4rem; background:var(--orange); }
  .tile.navy:before{ background:#4d6b8a; }
  .tile b{ font-family:var(--display); font-weight:400; font-size:1.45rem; line-height:1.2; }
  .tile span{ font-size:.95rem; color:var(--muted); }
  .tile.primary{ background:var(--orange); border-color:var(--orange); color:#fff; }
  .tile.primary:before{ background:#fff; }
  .tile.primary span{ color:rgba(255,255,255,.85); }

  .home-foot{ display:flex; align-items:center; justify-content:space-between; gap:1.2rem; }
  .qr{ display:flex; align-items:center; gap:.9rem; }
  .qr svg{ width:5.6rem; height:5.6rem; border-radius:.5rem; flex:0 0 auto; }
  .qr p{ margin:0; font-size:.9rem; color:var(--muted); line-height:1.35; }
  .qr strong{ display:block; color:var(--text); font-size:1.05rem; }

  /* ---------- Top bar (inside a section) ---------- */
  .top{
    flex:0 0 auto; display:flex; align-items:center; gap:1.2rem; padding:.8rem 1.6rem;
    background:var(--side); border-bottom:1px solid var(--border);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  }
  .brand-mini{ display:flex; align-items:center; gap:.8rem; min-height:3.4rem; border:0; background:none; color:var(--text); padding:0; }
  .brand-mini .logo{ width:3.6rem; }
  .brand-mini .wordmark{ font-size:1rem; }
  .nav{ display:flex; gap:.6rem; margin:0 auto; }
  .nav button{
    min-height:3.2rem; padding:0 1.5rem; font-size:1.05rem; font-weight:700; color:var(--text);
    background:transparent; border:1px solid var(--border); border-radius:1rem;
    transition:background .2s ease, border-color .2s ease;
  }
  .nav button[aria-selected="true"]{ background:var(--orange); border-color:var(--orange); color:#fff; }
  .home-btn{ gap:.5rem; }
  .home-btn svg{ width:1.2rem; height:1.2rem; }

/* ---------- Main ---------- */
  .main{ min-height:0; overflow-y:auto; overflow-x:hidden; padding:1.8rem 3rem 2rem; -webkit-overflow-scrolling:touch; }
  .panel{ display:none; animation:swap .35s ease both; }
  .panel.on{ display:block; }
  @keyframes swap{ from{ opacity:0; transform:translateX(14px); } to{ opacity:1; transform:none; } }

  h2.title{
    font-family:var(--display); font-weight:400; font-size:1.9rem; line-height:1.25;
    margin:0 0 1rem; letter-spacing:.01em;
  }
  .lead{ max-width:70ch; margin:0 0 .9rem; font-size:1.1rem; color:var(--muted); }
  .intro{ margin-bottom:1.4rem; }
  .intro-cols{ display:grid; grid-template-columns:1fr 1fr; gap:0 2.4rem; }
  .intro-cols .lead{ max-width:none; margin:0; font-size:1rem; }

  /* Solutions */
  .cards{ display:grid; grid-template-columns:repeat(auto-fit, minmax(17rem, 1fr)); gap:1.4rem; align-items:stretch; }
  .card{
    position:relative; display:flex; flex-direction:column; gap:.8rem;
    padding:1.5rem 1.5rem 1.4rem; background:var(--card);
    border:1px solid var(--border); border-radius:1.2rem; overflow:hidden;
  }
  .card:before{ content:""; position:absolute; left:0; right:0; top:0; height:.3rem; background:var(--grad); }
  .plate{
    display:flex; align-items:center; justify-content:center; height:6rem; padding:.8rem 1.2rem;
    background:transparent; margin-bottom:.4rem;
  }
  html.dark .plate img{ filter:drop-shadow(0 0 .5rem rgba(255,255,255,.22)); }
  .plate img{ max-width:100%; max-height:100%; object-fit:contain; display:block; -webkit-user-drag:none; }
  .tag{ font-size:.9rem; font-weight:700; color:var(--orange); margin:0; }
  .card h3{ font-family:var(--display); font-weight:400; font-size:1.6rem; margin:0; }
  .card p.desc{ margin:0; font-size:.95rem; color:var(--muted); line-height:1.6; }
  .cbtns{ margin-top:auto; display:flex; flex-wrap:wrap; gap:.7rem; }
  .card .spacer{ margin-top:auto; }

  /* Sites */
  .rows{ display:flex; flex-direction:column; gap:1rem; margin-top:1.6rem; }
  .row{
    display:grid; grid-template-columns:1fr auto; align-items:center; gap:1.2rem;
    padding:1.2rem 1.5rem; background:var(--card); border:1px solid var(--border); border-radius:1.2rem;
  }
  .row h3{ font-family:var(--display); font-weight:400; font-size:1.5rem; margin:0; }
  .row .host{ margin:.25rem 0 0; font-size:.95rem; color:var(--muted); }
  .row .acts{ display:flex; gap:.8rem; }
  .row .btn{ min-width:11rem; }

  /* Services */
  .pillars{ display:grid; grid-template-columns:repeat(auto-fit, minmax(17rem, 1fr)); gap:1.4rem; margin-top:1.6rem; }
  .pillar{ padding:0 0 0 1.3rem; border-left:.28rem solid var(--orange); }
  .pillar:nth-child(2){ border-color:var(--navy); }
  html.dark .pillar:nth-child(2){ border-color:#4d6b8a; }
  .pillar h3{ font-family:var(--display); font-weight:400; font-size:1.25rem; margin:0 0 .7rem; }
  .pillar p{ margin:0; font-size:1rem; color:var(--muted); line-height:1.65; }

  /* ---------- Viewer ---------- */
  .viewer{ position:fixed; inset:0; z-index:50; display:none; flex-direction:column; background:var(--bg); }
  .viewer.on{ display:flex; }
  .vbar{
    flex:0 0 auto; display:flex; flex-wrap:wrap; align-items:center; gap:.6rem .8rem; padding:.7rem 1rem;
    background:var(--bg-soft); border-bottom:1px solid var(--border);
  }
  .vbar .btn{ min-height:3rem; padding:0 1.1rem; font-size:.95rem; }
  .vtitle{ font-family:var(--display); font-size:1rem; margin:0 .4rem 0 .2rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .vseg{ display:flex; border:1px solid var(--border); border-radius:.9rem; overflow:hidden; }
  .vseg button{ min-height:3rem; padding:0 1.2rem; border:0; background:transparent; color:var(--muted); font-size:.95rem; font-weight:700; }
  .vseg button[aria-pressed="true"]{ background:var(--orange); color:#fff; }
  .vhint{ margin-left:auto; display:none; font-size:.8rem; color:var(--muted); text-align:right; max-width:22rem; line-height:1.3; }
  .vbody{ position:relative; flex:1; min-height:0; background:#fff; }
  .vbody iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff; }
  .vload{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:var(--bg); z-index:2; transition:opacity .25s ease;
  }
  .vload.done{ opacity:0; pointer-events:none; }
  .spin{ width:3.2rem; height:3.2rem; border-radius:50%; border:.3rem solid var(--border); border-top-color:var(--orange); animation:spin .9s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- Contact modal ---------- */
  .modal{ position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; padding:1.2rem; background:rgba(0,0,0,.6); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .modal.on{ display:flex; }
  .sheet{
    width:min(36rem, 100%); max-height:100%; overflow-y:auto; padding:2rem;
    background:var(--bg-soft); border:1px solid var(--border); border-radius:1.4rem;
  }
  .sheet-head{ display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1.2rem; }
  .sheet h2{ font-family:var(--display); font-weight:400; font-size:1.4rem; margin:0; }
  .field{ margin-bottom:1rem; }
  .field label{ display:block; font-size:.95rem; font-weight:600; margin-bottom:.4rem; }
  .field small{ font-weight:400; color:var(--muted); }
  .z2{ color:var(--orange); }
  .field input,.field select{
    width:100%; min-height:3.4rem; padding:0 1rem; font-size:1.05rem; color:var(--text);
    background:var(--card); border:1px solid var(--border); border-radius:.9rem;
  }
  .field select option{ color:#111; }
  .field.invalid input,.field.invalid select{ border-color:#e5484d; }
  .hp{ position:absolute; left:-9999px; width:1px; height:1px; opacity:0; }
  .submit-btn{ width:100%; border:0; background:var(--orange); color:#fff; }
  .submit-btn:disabled{ opacity:.6; }
  .form-status{ min-height:1.4rem; margin-top:.8rem; font-size:.95rem; text-align:center; }
  .form-status.ok{ color:#2fb57a; } .form-status.err{ color:#e5484d; }

  /* ---------- Portrait / small screens ---------- */
  @media (max-aspect-ratio: 1/1), (max-width: 860px){
    .home{ grid-template-columns:1fr; gap:1.6rem; padding:1.6rem 1.4rem; overflow-y:auto; align-content:start; }
    .home-brand .logo{ width:min(60%, 14rem); }
    .tile{ min-height:8rem; }
    .top{ flex-wrap:wrap; gap:.6rem 1rem; padding:.8rem 1rem; }
    .nav{ order:3; width:100%; margin:0; }
    .nav button{ flex:1; padding:0 .4rem; }
    .brand-mini .wordmark{ display:none; }
    .tools{ margin-left:auto; }
    .main{ padding:1.6rem 1.4rem 2rem; }
    .intro-cols{ grid-template-columns:1fr; }
    .row{ grid-template-columns:1fr; }
    .row .acts .btn{ flex:1; min-width:0; }
    .vhint{ display:none; }
  }
</style>
</head>

    var badName = d.name.length < 2;

<script>
/* Background: drifting points that link up when they are close */
(function(){
  var reduce = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var cv = document.getElementById('particles'), ctx = cv.getContext('2d');
  var W, H, DPR, parts = [];
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.width = innerWidth * DPR; H = cv.height = innerHeight * DPR;
    cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  }
  var pColors = [[251,85,33],[255,140,90],[96,140,190]];
  function initParticles(){
    var n = reduce ? 40 : Math.min(110, Math.round(innerWidth / 14));
    parts = [];
    for (var k = 0; k < n; k++){
      var c = pColors[(Math.random() * pColors.length) | 0];
      parts.push({ x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-.5)*.5*DPR, vy:(Math.random()-.5)*.5*DPR,
        r:(Math.random()*1.8+1.2)*DPR, c:c.join(','), a:Math.random()*.4+.5 });
    }
  }
  function tick(){
    ctx.clearRect(0, 0, W, H);
    var link = 150 * DPR, i, j, p, q, dx, dy, d;
    for (i = 0; i < parts.length; i++){
      p = parts[i];
      if (!reduce){ p.x += p.vx; p.y += p.vy; }
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
    }
    ctx.lineWidth = DPR;
    for (i = 0; i < parts.length; i++){
      p = parts[i];
      for (j = i + 1; j < parts.length; j++){
        q = parts[j]; dx = p.x - q.x; dy = p.y - q.y; d = Math.sqrt(dx*dx + dy*dy);
        if (d < link){
          ctx.strokeStyle = 'rgba(' + p.c + ',' + (.28 * (1 - d / link)) + ')';
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
        }
      }
    }
    for (i = 0; i < parts.length; i++){
      p = parts[i];
      ctx.fillStyle = 'rgba(' + p.c + ',' + p.a + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  window.addEventListener('resize', function(){ resize(); initParticles(); });
  resize(); initParticles(); requestAnimationFrame(tick);
})();
</script>
