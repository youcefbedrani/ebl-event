services:
  - type: static
    name: ebl-screen
    buildCommand: npm run build
    staticPublishPath: dist

  # One reverse proxy per site (proxy/server.mjs): lets every website open inside
  # the kiosk's built-in web view and fills in the admin sign-in automatically.
  # The base URLs must stay in sync with PROXY in src/data.js.
  - type: web
    name: ebl-proxy-purevia
    runtime: node
    rootDir: proxy
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.mjs
    healthCheckPath: /__ebl/health
    envVars:
      - key: TARGET
        value: https://purevia.ebl-offecial.com
      - key: EBL_USER
        value: admin@purevia.ebl-offecial.com
      - key: EBL_PASS
        value: ebl20252026

